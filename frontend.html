<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPLIFT AI | Inclusive Employment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden-step { display: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <nav class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-universal-access text-2xl"></i>
                    <span class="font-bold text-xl tracking-wide">UPLIFT AI</span>
                </div>
                <div class="flex space-x-1 sm:space-x-4">
                    <button onclick="switchView('pwd-view')" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition" id="nav-pwd-view">PWD Portal</button>
                    <button onclick="switchView('employer-view')" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition" id="nav-employer-view">Employers</button>
                    <button onclick="switchView('admin-view')" class="nav-btn px-3 py-2 rounded-md text-sm font-medium transition" id="nav-admin-view">NCDA Admin</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- PWD PORTAL -->
        <section id="pwd-view" class="view-section fade-in">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Find a Safe, Suitable Workplace</h1>
                <p class="text-slate-600">Our AI matches your specific physical capabilities with verified inclusive employers.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                    <h2 class="text-xl font-semibold mb-4 border-b pb-2">Your Profile</h2>
                    <form id="pwd-form" onsubmit="handlePwdMatch(event)">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                                <input type="text" id="pwd-name" required placeholder="e.g., Juan Dela Cruz" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Disability Type</label>
                                <select id="pwd-type" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none bg-white">
                                    <option value="Orthopedic">Orthopedic / Motor</option>
                                    <option value="Visual">Visual Impairment</option>
                                    <option value="Hearing">Hearing Impairment</option>
                                    <option value="Psychosocial">Psychosocial</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Physical Capabilities</label>
                                <textarea id="pwd-capabilities" required rows="3" placeholder="e.g., I can work 10 hours. I use a wheelchair." class="w-full p-2.5 border border-slate-300 rounded-lg outline-none resize-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Professional Skills</label>
                                <input type="text" id="pwd-skills" required placeholder="typing, computer, communication" class="w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                            </div>
                        </div>
                        <button type="submit" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-robot"></i> Find Safe Matches
                        </button>
                    </form>
                </div>

                <div class="lg:col-span-2">
                    <div id="loading-indicator" class="hidden flex-col items-center justify-center h-64 text-slate-500">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
                        <p>Semantic AI is analyzing physical compatibility...</p>
                    </div>

                    <div id="matches-container" class="hidden">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-2xl font-bold text-slate-800">Your AI Curated Matches</h2>
                            <span id="match-count" class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full"></span>
                        </div>
                        <div id="matches-list" class="space-y-4"></div>
                    </div>

                    <div id="empty-state" class="flex flex-col items-center justify-center h-full min-h-[300px] text-slate-400 bg-white rounded-xl border border-slate-200 border-dashed">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-3"></i>
                        <p>Fill out your profile and click "Find Safe Matches"</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- EMPLOYER PORTAL -->
        <section id="employer-view" class="view-section hidden-step fade-in max-w-2xl mx-auto">
            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200">
                <form id="employer-form" onsubmit="handleEmployerSubmit(event)">
                    <div class="space-y-5">
                        <div><label class="block text-sm font-medium mb-1">Employer Name</label><input type="text" id="emp-name" required class="w-full p-2.5 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium mb-1">Job Title</label><input type="text" id="emp-title" required class="w-full p-2.5 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium mb-1">Job Description</label><textarea id="emp-desc" required rows="3" class="w-full p-2.5 border rounded-lg"></textarea></div>
                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <label class="block text-sm font-bold text-blue-900 mb-1">Physical & Environmental Requirements</label>
                            <textarea id="emp-phys" required rows="3" placeholder="e.g., Requires standing for 8 hours. Must lift 5kg." class="w-full p-2.5 border rounded-lg"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="mt-6 w-full bg-slate-800 text-white font-medium py-3 rounded-lg">Submit for Verification</button>
                </form>
            </div>
        </section>

        <!-- NCDA ADMIN -->
        <section id="admin-view" class="view-section hidden-step fade-in">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold">NCDA Verification</h1>
                <button onclick="seedDemoData()" class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg font-medium"><i class="fa-solid fa-database"></i> Seed Demo Jobs</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="flex border-b">
                    <button onclick="fetchAdminJobs('pending')" class="flex-1 py-4 font-medium" id="tab-pending">Pending</button>
                    <button onclick="fetchAdminJobs('approved')" class="flex-1 py-4 font-medium" id="tab-approved">Approved</button>
                </div>
                <div class="p-6"><div id="admin-jobs-list" class="space-y-4"></div></div>
            </div>
        </section>
    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';
        let currentAdminTab = 'pending';

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-step'));
            document.getElementById(viewId).classList.remove('hidden-step');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-blue-800'));
            document.getElementById('nav-' + viewId).classList.add('bg-blue-800');
            if(viewId === 'admin-view') fetchAdminJobs(currentAdminTab);
        }
        switchView('pwd-view');

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg transform transition-all translate-y-10 opacity-0`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        async function handleEmployerSubmit(e) {
            e.preventDefault();
            const payload = { employer_name: document.getElementById('emp-name').value, job_title: document.getElementById('emp-title').value, job_description: document.getElementById('emp-desc').value, physical_requirements: document.getElementById('emp-phys').value };
            const res = await fetch(`${API_BASE_URL}/employer/submit-job`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if(res.ok) { showToast('Job submitted!'); document.getElementById('employer-form').reset(); }
        }

        async function fetchAdminJobs(status) {
            currentAdminTab = status;
            document.getElementById('tab-pending').className = status === 'pending' ? 'flex-1 py-4 text-blue-700 bg-blue-50 border-b-2 border-blue-600' : 'flex-1 py-4 text-slate-600 hover:bg-slate-50';
            document.getElementById('tab-approved').className = status === 'approved' ? 'flex-1 py-4 text-blue-700 bg-blue-50 border-b-2 border-blue-600' : 'flex-1 py-4 text-slate-600 hover:bg-slate-50';
            const res = await fetch(`${API_BASE_URL}/admin/jobs/${status}`);
            const data = await res.json();
            const container = document.getElementById('admin-jobs-list');
            if (data.jobs.length === 0) { container.innerHTML = '<p class="text-center py-8">No jobs found.</p>'; return; }
            container.innerHTML = data.jobs.map(job => `
                <div class="border p-4 rounded-lg bg-white flex justify-between items-center">
                    <div><h3 class="font-bold">${job.job_title}</h3><p class="text-sm text-slate-600">${job.physical_requirements}</p></div>
                    ${status === 'pending' ? `<button onclick="approveJob('${job.id}')" class="bg-blue-600 text-white px-4 py-2 rounded">Approve</button>` : `<span class="bg-emerald-100 px-3 py-1 rounded text-emerald-800">Vectorized</span>`}
                </div>`).join('');
        }

        async function approveJob(jobId) {
            await fetch(`${API_BASE_URL}/admin/approve-job/${jobId}`, { method: 'POST' });
            showToast('Job Approved!'); fetchAdminJobs('pending');
        }

        async function seedDemoData() {
            await fetch(`${API_BASE_URL}/demo/seed`);
            showToast('Demo data seeded!');
            if(!document.getElementById('admin-view').classList.contains('hidden-step')) fetchAdminJobs(currentAdminTab);
        }

        async function handlePwdMatch(e) {
            e.preventDefault();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('matches-container').classList.add('hidden');
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('loading-indicator').classList.add('flex');

            const payload = {
                name: document.getElementById('pwd-name').value,
                disability_type: document.getElementById('pwd-type').value,
                physical_capabilities: document.getElementById('pwd-capabilities').value,
                skills: document.getElementById('pwd-skills').value
            };

            const res = await fetch(`${API_BASE_URL}/pwd/match`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            
            setTimeout(() => {
                document.getElementById('loading-indicator').classList.add('hidden');
                document.getElementById('loading-indicator').classList.remove('flex');
                document.getElementById('matches-container').classList.remove('hidden');
                renderMatches(data);
            }, 800);
        }

        function renderMatches(data) {
            const container = document.getElementById('matches-list');
            document.getElementById('match-count').innerText = `${data.total_safe_matches} Safe Jobs Found`;
            
            if(data.total_safe_matches === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white border rounded-xl">No safe matches found above 60%.</div>`; return;
            }

            container.innerHTML = data.matches.map(match => `
                <div class="bg-white border border-slate-200 rounded-xl p-5 hover:shadow-lg transition">
                    <div class="flex flex-col sm:flex-row justify-between gap-6">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-slate-800">${match.job_title} <span class="text-sm font-normal text-blue-700 ml-2">@ ${match.employer}</span></h3>
                            
                            <div class="mt-3 mb-4">
                                <p class="text-xs font-bold text-slate-500 uppercase">Physical Requirements</p>
                                <p class="text-sm text-slate-700">${match.physical_requirements}</p>
                            </div>
                            
                            <!-- THIS IS THE NEW DETAILED AI INSIGHTS BOX -->
                            <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-4">
                                <p class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI Suitability Analysis</p>
                                <ul class="space-y-1.5">
                                    ${match.ai_insights.map(insight => `<li class="text-sm text-blue-800 flex items-start"><i class="fa-solid fa-check text-emerald-500 mt-1 mr-2 text-xs"></i> <span>${insight}</span></li>`).join('')}
                                </ul>
                            </div>
                            
                            <div class="flex flex-wrap gap-2">
                                <span class="text-xs font-bold text-slate-500 uppercase self-center">Matched Skills:</span>
                                ${match.matched_skills.map(s => `<span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs">${s}</span>`).join('')}
                            </div>
                        </div>

                        <div class="sm:w-48 shrink-0 flex flex-col items-center bg-slate-50 rounded-xl p-4 border">
                            <div class="w-24 h-24 rounded-full ring-4 ${match.metrics.final_accessibility_percentage >= 80 ? 'ring-emerald-500' : 'ring-blue-500'} flex items-center justify-center bg-white mb-2">
                                <span class="text-2xl font-black ${match.metrics.final_accessibility_percentage >= 80 ? 'text-emerald-600' : 'text-blue-600'}">${match.metrics.final_accessibility_percentage}%</span>
                            </div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Semantic: ${match.metrics.semantic_score}%</p>
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Keyword: ${match.metrics.keyword_score}%</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
