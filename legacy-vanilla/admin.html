<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPLIFT | Inclusive Employment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased font-sans">
<!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-colors duration-300" id="main-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-8">
                    <a href="#" class="flex items-center gap-2" href="index.html">
                        <i class="fa-solid fa-universal-access text-blue-600 text-2xl"></i>
                        <span class="font-bold text-xl tracking-tight text-blue-600">UPLIFT</span>
                    </a>
                    
                    <div id="nav-links" class="hidden md:flex gap-6 text-sm font-medium text-slate-500">
                        <button onclick="window.location.href='dashboard.html'" class="nav-btn hover:text-blue-600" id="nav-pwd-dashboard-view"><i class="fa-solid fa-magnifying-glass mr-1"></i> Jobs</button>
                        <button onclick="window.location.href='employer.html'" class="nav-btn hover:text-blue-600 hidden" id="nav-employer-view"><i class="fa-solid fa-building mr-1"></i> Employer Portal</button>
                        <button onclick="window.location.href='admin.html'" class="nav-btn hover:text-blue-600 hidden" id="nav-admin-view"><i class="fa-solid fa-screwdriver-wrench mr-1"></i> Admin</button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="auth-buttons" class="flex items-center">
                        <button onclick="openModal('login-modal')" class="text-slate-600 hover:text-blue-600 font-medium text-sm px-4">Log in</button>
                        <button onclick="openModal('register-modal')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-5 py-2 rounded-lg transition-colors shadow-sm">Sign up</button>
                    </div>
                    <div id="user-menu" class="hidden relative">
                        <button onclick="toggleDropdown('profile-dropdown')" class="flex items-center gap-2 hover:bg-slate-50 px-2 py-1 rounded-lg transition">
                            <div class="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-sm" id="nav-user-initials">U</div>
                            <span class="text-sm font-medium text-slate-700" id="nav-user-name">User</span>
                            <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                        </button>
                        <div id="profile-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-100 py-2 z-50">
                            <div class="px-4 py-2 border-b border-slate-100 mb-1">
                                <p class="text-sm font-bold text-slate-800" id="dropdown-name">User Name</p>
                                <p class="text-xs text-slate-500" id="dropdown-email">user@example.com</p>
                            </div>
                            <button onclick="window.location.href='profile.html'" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center"><i class="fa-solid fa-user-pen w-5 text-slate-400"></i> Customize Profile</button>
                            <button onclick="showToast('Resume upload coming soon!'); toggleDropdown('profile-dropdown')" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center"><i class="fa-solid fa-file-arrow-up w-5 text-slate-400"></i> Upload Resume</button>
                            <hr class="my-1 border-slate-100">
                            <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center"><i class="fa-solid fa-arrow-right-from-bracket w-5 text-red-400"></i> Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
<main class="flex-grow relative">
<!-- 4. ADMIN VIEW (Kept compatible) -->
        <section id="admin-view" class="view-section max-w-6xl mx-auto px-4 py-8">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold">Admin Verification Dashboard</h1>
                <button onclick="seedDemoData()" class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-lg font-medium hover:bg-emerald-200 transition"><i class="fa-solid fa-database mr-2"></i> Seed Demo Jobs</button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="flex border-b border-slate-200">
                    <button onclick="fetchAdminJobs('pending')" class="flex-1 py-4 font-bold text-blue-700 bg-blue-50 border-b-2 border-blue-600 transition" id="tab-pending">Pending Approval</button>
                    <button onclick="fetchAdminJobs('approved')" class="flex-1 py-4 font-bold text-slate-500 hover:bg-slate-50 transition" id="tab-approved">Live Jobs</button>
                </div>
                <div class="p-6 bg-slate-50 min-h-[400px]">
                    <div id="admin-jobs-list" class="space-y-4"></div>
                </div>
            </div>
        </section>
</main>
<!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Accessibility features from script.js will be dynamically injected or handled -->
    <button id="accessibility-fab" onclick="toggleA11yPanel()" class="bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300" aria-label="Open Accessibility Menu">
        <i class="fa-solid fa-universal-access text-2xl"></i>
    </button>
    <div id="accessibility-panel" class="p-6"></div> <!-- Filled by JS -->

    <script src="script.js"></script>
</body>
</html>
